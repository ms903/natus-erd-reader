name: Build release assets

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: pypa/cibuildwheel@v4.2.0
        with:
          output-dir: wheelhouse
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  pure-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install build setuptools wheel numpy
      - run: python tools/build_artifacts.py --kind pure --output dist
      - name: Test wheel and native rebuild from sdist
        shell: bash
        run: |
          python tools/test_install.py dist/*-py3-none-any.whl --backend pure
          python tools/test_install.py dist/*.tar.gz --backend native
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: pure-and-source
          path: dist/*
          if-no-files-found: error

  audit:
    needs: [native, pure-and-source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: native-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: pure-and-source
          path: dist
      - run: python -m pip install twine
      - name: Check complete distribution set
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python tools/check_dist.py dist --version "$version" --complete
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
