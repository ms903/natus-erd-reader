name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  assets:
    uses: ./.github/workflows/build-assets.yml

  release:
    needs: assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: release-assets
          path: dist
      - name: Publish audited versioned assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, subprocess, tomllib
          from pathlib import Path
          from tools.check_dist import audit_set
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          tag = os.environ['RELEASE_TAG']
          assert tag == 'v'+version, 'Tag does not match package version'
          assets = audit_set(Path('dist'), version, complete=True)
          command = ['gh', 'release', 'create', tag, *map(str, assets), '--verify-tag',
                     '--title', tag, '--notes-file', 'CHANGELOG.md']
          if 'rc' in version:
              command.append('--prerelease')
          subprocess.run(command, check=True)
          PY
