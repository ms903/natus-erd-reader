name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Bound the test runner's numerical backend; the library never sets this.
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine .
      - name: Check tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, natus_erd; assert os.environ['RELEASE_TAG'] == 'v' + natus_erd.__version__"
      - run: python -m unittest discover -v -s tests -t .
      - run: python -m build
      - run: python -m twine check dist/*
      - run: python tools/check_dist.py dist
      - name: Publish audited archives to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md
