name: Publish GitHub Release to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public release tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'ms903/natus-erd-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download the exact public release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          release = json.loads(Path("release.json").read_text())
          import re
          if not re.fullmatch(r"v\d+\.\d+\.\d+(?:rc\d+)?", tag):
              raise SystemExit("Expected vX.Y.Z or vX.Y.ZrcN")
          if release["tagName"] != tag or release["isDraft"] or release["isPrerelease"] != ("rc" in version):
              raise SystemExit("Release status does not match its version")
          PY
          gh release download "$RELEASE_TAG" --dir dist --pattern '*.whl' --pattern '*.tar.gz'
      - name: Audit archive contents and package metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m pip install twine
          python tools/check_dist.py dist --version "${RELEASE_TAG#v}" --complete
          python -m twine check --strict dist/*
          (cd dist && sha256sum *.whl *.tar.gz) > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        id: upload
        with:
          name: audited-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/natus-erd-reader/
    permissions:
      id-token: write
    steps:
      # This job neither checks out nor executes package/repository code.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify audited bytes before upload
        run: cd dist && sha256sum --check ../SHA256SUMS
      - name: Publish through the PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
