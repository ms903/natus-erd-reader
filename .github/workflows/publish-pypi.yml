name: Publish GitHub Release to PyPI

on:
  # Deliberately manual: publishing a GitHub Release does not publish to PyPI.
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing public stable release tag to publish
        required: true
        default: v0.2.1
        type: string

permissions: {}

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  audit:
    if: github.repository == 'ms903/natus-erd-reader' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Download the exact public release distributions
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected a stable release tag of the form vX.Y.Z" >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets > release.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          release = json.loads(Path("release.json").read_text())
          expected = {
              f"natus_erd_reader-{version}-py3-none-any.whl",
              f"natus_erd_reader-{version}.tar.gz",
          }
          distributions = [
              item["name"] for item in release["assets"]
              if item["name"].endswith((".whl", ".tar.gz"))
          ]
          if (
              release["tagName"] != tag or release["isDraft"] or release["isPrerelease"]
              or len(distributions) != 2 or set(distributions) != expected
          ):
              raise SystemExit("Release must be public and stable with exactly the expected wheel and sdist")
          PY
          version="${RELEASE_TAG#v}"
          gh release download "$RELEASE_TAG" --dir dist \
            --pattern "natus_erd_reader-${version}-py3-none-any.whl" \
            --pattern "natus_erd_reader-${version}.tar.gz"
      - name: Audit archive contents and package metadata
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python -m pip install twine
          python tools/check_dist.py dist
          python -m twine check --strict dist/*
          python - <<'PY'
          import email.parser
          import os
          import tarfile
          import zipfile
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          stem = f"natus_erd_reader-{version}"
          expected = {f"{stem}-py3-none-any.whl", f"{stem}.tar.gz"}
          if {item.name for item in Path("dist").iterdir()} != expected:
              raise SystemExit("Unexpected file in the publication directory")
          with zipfile.ZipFile(Path("dist", f"{stem}-py3-none-any.whl")) as wheel:
              wheel_metadata = wheel.read(f"natus_erd_reader-{version}.dist-info/METADATA")
          with tarfile.open(Path("dist", f"{stem}.tar.gz"), "r:gz") as sdist:
              with sdist.extractfile(f"{stem}/PKG-INFO") as metadata_file:
                  source_metadata = metadata_file.read()
          for raw_metadata in (wheel_metadata, source_metadata):
              metadata = email.parser.BytesParser().parsebytes(raw_metadata)
              if metadata.get_all("Name") != ["natus-erd-reader"] or metadata.get_all("Version") != [version]:
                  raise SystemExit("Distribution identity does not match the requested release")
          PY
          (cd dist && sha256sum *.whl *.tar.gz) > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        id: upload
        with:
          name: audited-pypi-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/natus-erd-reader/
    permissions:
      id-token: write
    steps:
      # This job neither checks out nor executes package/repository code.
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          artifact-ids: ${{ needs.audit.outputs.artifact_id }}
          merge-multiple: true
      - name: Verify audited bytes before upload
        run: cd dist && sha256sum --check ../SHA256SUMS
      - name: Publish through the PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          print-hash: true
