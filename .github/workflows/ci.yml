name: Tests and package build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Test-runner policy, not a setting imposed by the installed library.
env:
  OPENBLAS_NUM_THREADS: "1"
  OMP_NUM_THREADS: "1"
  NATUS_ERD_REQUIRE_NATIVE: "1"

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install ".[dev]"
      - run: python -c "from natus_erd import _native; assert callable(_native.process)"
      - run: python -m unittest discover -v -s tests -t .
      - run: python -m mypy src/natus_erd
      - run: python -c "import importlib.metadata as m, natus_erd; assert m.version('natus-erd-reader') == natus_erd.__version__"

  minimum-numpy:
    name: Python 3.10 / NumPy 1.24.x / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - run: python -m pip install "numpy==1.24.0" tqdm
      - run: python -m pip install --no-deps .
      - run: python -c "from natus_erd import _native; assert callable(_native.process)"
      - run: python -m unittest discover -v -s tests -t .
      - run: python -c "import numpy; assert numpy.__version__ == '1.24.0'"

  pure-python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      NATUS_ERD_NO_NATIVE: "1"
      NATUS_ERD_REQUIRE_NATIVE: "0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - run: python -m pip install .
      - run: python -c "from natus_erd._export_worker import native_available; assert not native_available()"
      - run: python -m unittest discover -v -s tests -t .

  sanitizers:
    name: Linux native ASan and UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install numpy tqdm
      - name: Build instrumented native extension
        env:
          CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer -g"
          LDFLAGS: "-fsanitize=address,undefined"
        run: python -m pip install --no-deps --no-cache-dir .
      - name: Differential, malformed input and conversion regressions
        env:
          ASAN_OPTIONS: "detect_leaks=0:halt_on_error=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
          PYTHONMALLOC: malloc
        shell: bash
        run: |
          set -euo pipefail
          export LD_PRELOAD="$(gcc -print-file-name=libasan.so)"
          python -c "from natus_erd import _native; assert callable(_native.process)"
          python -m unittest -v tests.test_native tests.test_edf_export

  interoperability:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install ".[interop,timezones]"
      - run: python -m unittest -v tests.test_edf_export

  distributions:
    uses: ./.github/workflows/build-assets.yml
