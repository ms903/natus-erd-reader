[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "natus-erd-reader"
version = "0.3.0rc1"
description = "Resource-bounded Natus ERD reader and continuous EDF+C export"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ms903 and natus-erd-reader contributors"}]
dependencies = ["numpy>=1.24"]
keywords = ["eeg", "seeg", "natus", "neuroworks", "erd"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/ms903/natus-erd-reader"
Repository = "https://github.com/ms903/natus-erd-reader"
Issues = "https://github.com/ms903/natus-erd-reader/issues"
Changelog = "https://github.com/ms903/natus-erd-reader/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["build>=1.2", "twine>=5", "mypy>=1.8"]
interop = ["mne>=1.6", "pyedflib>=0.1.40"]
timezones = ["tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
natus_erd = ["py.typed", "*.pyi"]

[tool.mypy]
files = ["src/natus_erd"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win32 *-win_arm64 *-musllinux_*"
archs = ["auto64"]
test-requires = ["numpy"]
test-command = "python -c \"from natus_erd import _native; assert callable(_native.process)\" && python -m unittest discover -s {project}/tests -t {project}"
environment = { NATUS_ERD_REQUIRE_NATIVE = "1", OPENBLAS_NUM_THREADS = "1", OMP_NUM_THREADS = "1" }
